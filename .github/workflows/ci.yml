name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck + suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test suite + coverage ≥80% (critical include set)
        run: npm run test:coverage
        env:
          CI: true

      - name: E2E entry (home + login) or documented skip
        run: npm run test:e2e
        env:
          CI: true
          COVERAGE_SCRATCH: ${{ runner.temp }}/e2e-scratch

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-summary
          path: web/coverage/coverage-summary.json
          if-no-files-found: ignore
