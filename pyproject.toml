[project]
name = "portfolio-analysis"
version = "0.1.0"
description = "CANSLIM-oriented portfolio analysis: honest per-symbol and per-account (retail private fund) performance"
authors = [{name = "Ivelin Ivanov"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "numpy-financial>=1.0",
    "pandas>=2.0",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
pdf-extraction = ["pdfplumber>=0.10"]  # Legacy / one-off PDF tools only (retired for primary GT ingestion)
mcp = ["mcp>=1.0"]  # For portfolio-mcp server (Streamable HTTP + stdio tools mirroring the CLI)

[project.scripts]
portfolio = "portfolio_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: marks tests as requiring live DB (deselect with '-m \"not live\"')",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.1",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
